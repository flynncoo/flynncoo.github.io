  <main id="main" class="wrapper">
    <div class="inner">
<h1>News</h1>
							<p>Recent articles, talks, conferences, and events. <a href="now.xml">RSS feed</a></p>

							<div class="feed-filters">
								<span>Show:</span>
								<button class="filter-btn active" aria-pressed="true" data-filter="all">All</button>
								<button class="filter-btn" aria-pressed="false" data-filter="article">Articles</button>
								<button class="filter-btn" aria-pressed="false" data-filter="conference">Talks</button>
								<button class="filter-btn" aria-pressed="false" data-filter="attendance">Conferences attended</button>
								<button class="filter-btn" aria-pressed="false" data-filter="event">Events</button>

							</div>

      <div id="feed-timeline" aria-live="polite"><p>Loading news…</p></div>
      <noscript><p>Read the <a href="now.xml">RSS feed</a> for news.</p></noscript>
    </div>
  </main>

		<!-- Footer -->
			<footer id="footer" class="wrapper alt">
				<div class="inner">
					<ul class="menu">
						<li>&copy; Oisín Flynn-Connolly. All rights reserved.</li><li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
					</ul>
				</div>
			</footer>

		<!-- Scripts -->
			<script>
				(function() {
					var allItems = [];

					var typeLabels = {
						article:    'Article',
						conference: 'Talk',
						attendance: 'Conference',
						event:      'Event'
					};

					function renderTimeline(filter) {
						var container = document.getElementById('feed-timeline');
						var items = filter === 'all'
							? allItems
							: allItems.filter(function(item) { return item.type === filter; });

						if (items.length === 0) {
							container.innerHTML = '<p>No items to show.</p>';
							return;
						}

						var html = '';
						items.forEach(function(item) {
							var dt = new Date(item.date + 'T00:00:00');
							var dateStr = dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
							var title = item.url
								? '<a href="' + item.url + '">' + item.title + '</a>'
								: item.title;

                            html += '<article class="news-item" data-type="' + item.type + '">'
                                + '<p class="page-meta"><time datetime="' + item.date + '">' + dateStr + '</time> · ' + typeLabels[item.type] + '</p>'
                                + '<h2>' + title + '</h2>'
                                + '<p>' + item.description + '</p>'
                                + '</article>';
						});
						container.innerHTML = html;
					}

					// Filter buttons
					document.querySelectorAll('.filter-btn').forEach(function(btn) {
						btn.addEventListener('click', function() {
							document.querySelectorAll('.filter-btn').forEach(function(b) {
								b.classList.remove('active');
                                b.setAttribute('aria-pressed', 'false');
							});
							btn.classList.add('active');
                            btn.setAttribute('aria-pressed', 'true');
							renderTimeline(btn.getAttribute('data-filter'));
						});
					});

					// Load data
					fetch('news.json')
						.then(function(r) { return r.json(); })
						.then(function(items) {
							items.sort(function(a, b) { return b.date.localeCompare(a.date); });
							allItems = items;
							renderTimeline('all');
						})
                        .catch(function() {
                            document.getElementById('feed-timeline').innerHTML = '<p>Could not load news. <a href="now.xml">Read the RSS feed.</a></p>';
                        });
				})();
			</script>

	</body>
