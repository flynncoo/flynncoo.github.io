    <div class="inner">
<h1>Blog</h1>
							<p><a href="feed.xml">RSS feed</a></p>
							<div id="post-list">
								<p>Loading posts…</p>
        <noscript><p>Read the <a href="feed.xml">RSS feed</a> for posts.</p></noscript>
      </div>
    </div>

		<!-- Scripts -->
			<script>
				fetch('posts.json')
					.then(function(r) { return r.json(); })
					.then(function(posts) {
						posts.sort(function(a, b) { return b.date.localeCompare(a.date); });
						if (posts.length === 0) {
							document.getElementById('post-list').innerHTML = '<p>No posts yet.</p>';
							return;
						}
						var html = '<ul>';
						posts.forEach(function(post) {
							var dt = new Date(post.date + 'T00:00:00');
							var dateStr = dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
							var slug = post.file.replace(/\.md$/, '');
							html += '<li>'
								+ '<p class="page-meta"><time datetime="' + post.date + '">' + dateStr + '</time></p>'
                                + '<h2><a href="post.html?post=' + slug + '">' + post.title + '</a></h2>'
                                + (post.description ? '<p>' + post.description + '</p>' : '')
								+ '</li>';
						});
						html += '</ul>';
						document.getElementById('post-list').innerHTML = html;
					})
					.catch(function() {
						document.getElementById('post-list').innerHTML = '<p>Could not load posts.</p>';
					});
			</script>

	</body>
